<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rapid Reacquisition Preset</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    label { font-weight: 600; }
    input[type="range"], select, input[type="text"] {
      width: 100%;
      margin-top: 0.4rem;
    }

    select {
      height: 2rem;
    }

    .panel {
      border-left: 3px solid #eee;
      padding-left: 1rem;
      margin-top: 1.5rem;
    }

    button, .btn {
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }

    .error {
      background: #ffe6e6;
      color: #900;
      padding: 0.6rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>Rapid Reacquisition Preset</h1>
<p>Acquisition in A → Extinction in B → Return to A → Reacquisition.</p>

<button class="btn" id="back-btn">Back to Presets</button>

<div class="panel">
  <h3>Trials</h3>
  <label>Acquisition Trials: <span id="n_acq_val">50</span></label>
  <input id="n_acq" type="range" min="1" max="500" value="50" />

  <label>Extinction Trials: <span id="n_ext_val">50</span></label>
  <input id="n_ext" type="range" min="1" max="500" value="50" />

  <label>Reacquisition Trials: <span id="n_reacq_val">20</span></label>
  <input id="n_reacq" type="range" min="1" max="200" value="20" />
</div>

<div class="panel">
  <h3>Learning</h3>
  <label>Learning Rate (alpha): <span id="a_val">0.2</span></label>
  <input id="alpha" type="range" min="0" max="1" step="0.01" value="0.2" />

  <label>Discount (gamma): <span id="g_val">0</span></label>
  <input id="gamma" type="range" min="0" max="1" step="0.05" value="0" />
</div>

<div class="panel">
  <h3>Stimuli</h3>
  <label>CS+</label>
  <select id="cs_plus"></select>

  <label>Salience (applies to CS+): <span id="s_val">1.0</span></label>
  <input id="salience" type="range" min="0" max="1" step="0.05" value="1.0" />
</div>

<div class="panel">
  <h3>Context</h3>
  <label>Context A</label>
  <select id="ctx_a">
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
  </select>

  <label>Context B</label>
  <select id="ctx_b">
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
  </select>
</div>

<h2>Generated Payload</h2>
<pre id="payload-view"></pre>

<button id="run-btn">Run Experiment</button>
<pre id="run-output">Not run yet.</pre>

<script>
const STIMULI = ["tone", "noise", "light", "click"];

let params = {
  n_acquisition_trials: 50,
  n_extinction_trials: 50,
  n_reacquisition_trials: 20,
  alpha: 0.2,
  gamma: 0,
  cs_plus: ["tone"],
  salience: 1.0,
  context_a: "A",
  context_b: "B"
};

function collectStimuli() {
  return [...STIMULI];
}

function populateStimuli() {
  const select = document.getElementById("cs_plus");
  select.innerHTML = "";
  STIMULI.forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    if (params.cs_plus.includes(s)) o.selected = true;
    select.appendChild(o);
  });
}

function buildPayload() {
  const salienceMap = {};
  params.cs_plus.forEach(s => {
    salienceMap[s] = { salience: params.salience };
  });
  const attentionMap = {};
  params.cs_plus.forEach(s => {
    attentionMap[s] = { attention: 1.0 };
  });

  return {
    experiment: {
      learner: "rescorla_wagner",
      agent: "classical_agent",
      representation: {
        name: "vector_hybrid",
        params: {
          stimuli: collectStimuli(),
          max_compound_size: 2,
          include_global: true,
          include_context: true
        }
      },
      context_inference: { enabled: false, max_contexts: 3 },
      protocol: "rapid_reacquisition",
      stimuli: {
        cs_plus: params.cs_plus,
        cs_minus: []
      },
      params: {
        n_acquisition_trials: params.n_acquisition_trials,
        n_extinction_trials: params.n_extinction_trials,
        n_reacquisition_trials: params.n_reacquisition_trials,
        alpha: params.alpha,
        gamma: params.gamma,
        context_a: params.context_a,
        context_b: params.context_b
      },
      salience: salienceMap,
      attention: attentionMap
    },
    report: { preset: "rapid_reacquisition" }
  };
}

function renderPayload() {
  document.getElementById("payload-view").textContent =
    JSON.stringify(buildPayload(), null, 2);
}

function validate() {
  if (params.n_acquisition_trials < 1) throw new Error("n_acquisition_trials must be at least 1");
  if (params.n_extinction_trials < 1) throw new Error("n_extinction_trials must be at least 1");
  if (params.n_reacquisition_trials < 1) throw new Error("n_reacquisition_trials must be at least 1");
  if (params.alpha < 0 || params.alpha > 1) throw new Error("alpha must be 0-1");
  if (params.gamma < 0 || params.gamma > 1) throw new Error("gamma must be 0-1");
  if (!params.cs_plus.length) throw new Error("Select a CS+ stimulus");
  if (!params.context_a) throw new Error("Context A is required");
  if (!params.context_b) throw new Error("Context B is required");
}

document.getElementById("back-btn").onclick = () => {
  window.location.href = "/ui/presets.html";
};

document.getElementById("n_acq").oninput = e => {
  params.n_acquisition_trials = +e.target.value;
  document.getElementById("n_acq_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("n_ext").oninput = e => {
  params.n_extinction_trials = +e.target.value;
  document.getElementById("n_ext_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("n_reacq").oninput = e => {
  params.n_reacquisition_trials = +e.target.value;
  document.getElementById("n_reacq_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha").oninput = e => {
  params.alpha = +e.target.value;
  document.getElementById("a_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("gamma").oninput = e => {
  params.gamma = +e.target.value;
  document.getElementById("g_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("salience").oninput = e => {
  params.salience = +e.target.value;
  document.getElementById("s_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("cs_plus").onchange = e => {
  params.cs_plus = [e.target.value];
  renderPayload();
};

document.getElementById("ctx_a").onchange = e => {
  params.context_a = e.target.value;
  renderPayload();
};

document.getElementById("ctx_b").onchange = e => {
  params.context_b = e.target.value;
  renderPayload();
};

document.getElementById("run-btn").onclick = async () => {
  const output = document.getElementById("run-output");
  output.classList.remove("error");

  let payload;
  try {
    validate();
    payload = buildPayload();
  } catch (err) {
    output.textContent = err.message;
    output.classList.add("error");
    return;
  }

  output.textContent = "Running...";

  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok && data.run_id) {
    window.location.href = `/ui/results.html?run_id=${data.run_id}`;
    return;
  }

  output.textContent = JSON.stringify(data, null, 2);
};

populateStimuli();
document.getElementById("ctx_a").value = params.context_a;
document.getElementById("ctx_b").value = params.context_b;
renderPayload();
</script>

</body>
</html>
