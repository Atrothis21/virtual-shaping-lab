<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Differential Acquisition Preset</title>

  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 900px; }
    label { font-weight: 600; }
    input[type="range"], select[multiple] { width: 100%; margin-top: 0.4rem; }
    select[multiple] { height: 6rem; }
    .panel { border-left: 3px solid #eee; padding-left: 1rem; margin-top: 1.5rem; }
    button, .btn { margin-top: 0.6rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    .error { background: #ffe6e6; color: #900; padding: 0.6rem; border-radius: 6px; }
  </style>
</head>
<body>

<h1>Differential Acquisition Preset</h1>
<p>CS+ reinforced and CS- nonreinforced within a single phase.</p>

<button class="btn" id="back-btn">Back to Presets</button>

<div class="panel">
  <h3>Trials</h3>
  <label>Number of Trials: <span id="n_val">100</span></label>
  <input id="n_trials" type="range" min="1" max="500" value="100" />
</div>

<div class="panel">
  <h3>Learning</h3>
  <label>Learning Rate (alpha): <span id="a_val">0.2</span></label>
  <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.2" />
  <label>Salience (applies to selected CS+): <span id="s_val">1.0</span></label>
  <input id="salience" type="range" min="0" max="1" step="0.05" value="1.0" />
</div>

<div class="panel">
  <h3>Stimuli</h3>
  <label>CS+ Stimuli</label>
  <select id="cs_plus" multiple></select>

  <br /><br />

  <label>CS- Stimuli</label>
  <select id="cs_minus" multiple></select>
</div>

<div class="panel">
  <h3>Representation</h3>
  <label>Type</label>
  <select id="representation">
    <option value="vector_elemental">vector_elemental</option>
    <option value="vector_configural">vector_configural</option>
    <option value="vector_hybrid">vector_hybrid</option>
  </select>
</div>

<h2>Generated Payload</h2>
<pre id="payload-view"></pre>

<button id="run-btn">Run Experiment</button>
<pre id="run-output">Not run yet.</pre>

<script>
const STIMULI = ["tone", "noise", "light", "click"];

let params = {
  n_trials: 100,
  alpha: 0.2,
  salience: 1.0,
  cs_plus: ["tone"],
  cs_minus: ["noise"],
  representation: "vector_elemental"
};

function populate(select, selected) {
  select.innerHTML = "";
  STIMULI.forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    if (selected.includes(s)) o.selected = true;
    select.appendChild(o);
  });
}

function selectedValues(select) {
  return Array.from(select.selectedOptions).map(o => o.value);
}

function setSelected(select, values) {
  Array.from(select.options).forEach(o => {
    o.selected = values.includes(o.value);
  });
}

function disableFromOther(select, otherSelected) {
  Array.from(select.options).forEach(o => {
    o.disabled = otherSelected.includes(o.value);
  });
}

function syncStimuliSelections(changed) {
  const plusSelect = document.getElementById("cs_plus");
  const minusSelect = document.getElementById("cs_minus");

  let csPlus = selectedValues(plusSelect);
  let csMinus = selectedValues(minusSelect);

  if (changed === "plus") {
    csMinus = csMinus.filter(s => !csPlus.includes(s));
    setSelected(minusSelect, csMinus);
  } else if (changed === "minus") {
    csPlus = csPlus.filter(s => !csMinus.includes(s));
    setSelected(plusSelect, csPlus);
  }

  disableFromOther(plusSelect, csMinus);
  disableFromOther(minusSelect, csPlus);

  params.cs_plus = csPlus;
  params.cs_minus = csMinus;

  renderPayload();
}

function buildPayload() {
  const salienceMap = {};
  params.cs_plus.forEach(s => {
    salienceMap[s] = { salience: params.salience };
  });
  const attentionMap = {};
  [...params.cs_plus, ...params.cs_minus].forEach(s => {
    attentionMap[s] = { attention: 1.0 };
  });

  return {
    experiment: {
      learner: "rescorla_wagner",
      agent: "classical_agent",
      representation: {
        name: params.representation,
        params: { stimuli: STIMULI, max_compound_size: 2 }
      },
      context_inference: { enabled: false, max_contexts: 3 },
      phases: [{
        name: "Differential Acquisition",
        protocol: "differential_acquisition",
        stimuli: {
          cs_plus: params.cs_plus,
          cs_minus: params.cs_minus
        },
        params: {
          n_trials: params.n_trials,
          alpha: params.alpha
        }
      }],
      salience: salienceMap,
      attention: attentionMap,
    },
    report: { preset: "differential_acquisition" }
  };
}

function renderPayload() {
  document.getElementById("payload-view").textContent =
    JSON.stringify(buildPayload(), null, 2);
}

function validate() {
  if (params.n_trials < 1) throw new Error("n_trials must be at least 1");
  if (params.alpha < 0 || params.alpha > 1) throw new Error("alpha must be 0-1");
  if (!params.cs_plus.length) throw new Error("Select at least one CS+ stimulus");
  if (!params.cs_minus.length) throw new Error("Select at least one CS- stimulus");
}

document.getElementById("back-btn").onclick = () => {
  window.location.href = "/ui/presets.html";
};

document.getElementById("n_trials").oninput = e => {
  params.n_trials = +e.target.value;
  document.getElementById("n_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha").oninput = e => {
  params.alpha = +e.target.value;
  document.getElementById("a_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("salience").oninput = e => {
  params.salience = +e.target.value;
  document.getElementById("s_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("cs_plus").onchange = () => {
  syncStimuliSelections("plus");
};

document.getElementById("cs_minus").onchange = () => {
  syncStimuliSelections("minus");
};

document.getElementById("representation").onchange = e => {
  params.representation = e.target.value;
  renderPayload();
};

document.getElementById("run-btn").onclick = async () => {
  const output = document.getElementById("run-output");
  output.classList.remove("error");

  let payload;
  try {
    validate();
    payload = buildPayload();
  } catch (err) {
    output.textContent = err.message;
    output.classList.add("error");
    return;
  }

  output.textContent = "Running...";

  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok && data.run_id) {
    window.location.href = `/ui/results.html?run_id=${data.run_id}`;
    return;
  }

  output.textContent = JSON.stringify(data, null, 2);
};

populate(document.getElementById("cs_plus"), params.cs_plus);
populate(document.getElementById("cs_minus"), params.cs_minus);
syncStimuliSelections("plus");
</script>

</body>
</html>
