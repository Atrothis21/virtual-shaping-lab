<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blocking Preset</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    label { font-weight: 600; }
    input[type="range"], select[multiple], select {
      width: 100%;
      margin-top: 0.4rem;
    }

    select[multiple] {
      height: 6rem;
    }

    .panel {
      border-left: 3px solid #eee;
      padding-left: 1rem;
      margin-top: 1.5rem;
    }

    button, .btn {
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }

    .error {
      background: #ffe6e6;
      color: #900;
      padding: 0.6rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>Blocking Preset</h1>
<p>Protocol: A+ acquisition followed by AX+ compound acquisition (blocking).</p>

<button class="btn" id="back-btn">Back to Presets</button>

<div class="panel">
  <h3>Trials</h3>
  <label>Acquisition Trials (A+): <span id="n_acq_val">50</span></label>
  <input id="n_acq" type="range" min="1" max="500" value="50" />

  <label>Compound Trials (AX+): <span id="n_comp_val">50</span></label>
  <input id="n_comp" type="range" min="1" max="500" value="50" />
</div>

<div class="panel">
  <h3>Learning</h3>
  <label>Learning Rate (alpha): <span id="a_val">0.2</span></label>
  <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.2" />
</div>

<div class="panel">
  <h3>Stimuli</h3>
  <label>CS+ A</label>
  <select id="stim_a"></select>

  <label>CS+ X</label>
  <select id="stim_x"></select>

  <label>Salience (A): <span id="s_a_val">1.0</span></label>
  <input id="salience_a" type="range" min="0" max="1" step="0.05" value="1.0" />

  <label>Salience (X): <span id="s_x_val">1.0</span></label>
  <input id="salience_x" type="range" min="0" max="1" step="0.05" value="1.0" />
</div>

<div class="panel">
  <h3>Representation</h3>
  <label>Type</label>
  <select id="representation">
    <option value="vector_elemental">vector_elemental</option>
    <option value="vector_configural">vector_configural</option>
    <option value="vector_hybrid">vector_hybrid</option>
  </select>
</div>

<h2>Generated Payload</h2>
<pre id="payload-view"></pre>

<button id="run-btn">Run Experiment</button>
<pre id="run-output">Not run yet.</pre>

<script>
const STIMULI = ["tone", "noise", "light", "click"];

let params = {
  n_acq: 50,
  n_comp: 50,
  alpha: 0.2,
  stim_a: "tone",
  stim_x: "noise",
  salience_a: 1.0,
  salience_x: 1.0,
  representation: "vector_elemental"
};

function populateStimuli() {
  const aSelect = document.getElementById("stim_a");
  const xSelect = document.getElementById("stim_x");

  aSelect.innerHTML = "";
  xSelect.innerHTML = "";

  STIMULI.forEach(s => {
    const o1 = document.createElement("option");
    o1.value = s;
    o1.textContent = s;
    if (params.stim_a === s) o1.selected = true;
    aSelect.appendChild(o1);

    const o2 = document.createElement("option");
    o2.value = s;
    o2.textContent = s;
    if (params.stim_x === s) o2.selected = true;
    xSelect.appendChild(o2);
  });

  enforceDistinct();
}

function enforceDistinct() {
  const aSelect = document.getElementById("stim_a");
  const xSelect = document.getElementById("stim_x");

  Array.from(xSelect.options).forEach(o => {
    o.disabled = (o.value === params.stim_a);
  });
  Array.from(aSelect.options).forEach(o => {
    o.disabled = (o.value === params.stim_x);
  });

  if (params.stim_a === params.stim_x) {
    const fallback = STIMULI.find(s => s !== params.stim_a);
    params.stim_x = fallback;
    xSelect.value = fallback;
  }
}

function buildPayload() {
  const salienceMap = {};
  salienceMap[params.stim_a] = { salience: params.salience_a };
  salienceMap[params.stim_x] = { salience: params.salience_x };
  const attentionMap = {};
  Object.keys(salienceMap).forEach(s => {
    attentionMap[s] = { attention: 1.0 };
  });

  return {
    experiment: {
      learner: "rescorla_wagner",
      agent: "classical_agent",
      representation: {
        name: params.representation,
        params: { stimuli: STIMULI, max_compound_size: 2 }
      },
      context_inference: { enabled: false, max_contexts: 3 },
      protocol: "blocking",
      stimuli: {
        cs_plus: [params.stim_a, params.stim_x]
      },
      params: {
        n_acquisition_trials: params.n_acq,
        n_compound_trials: params.n_comp,
        alpha: params.alpha
      },
      salience: salienceMap,
      attention: attentionMap
    },
    report: { preset: "blocking" }
  };
}

function renderPayload() {
  document.getElementById("payload-view").textContent =
    JSON.stringify(buildPayload(), null, 2);
}

function validate() {
  if (params.n_acq < 1) throw new Error("n_acquisition_trials must be at least 1");
  if (params.n_comp < 1) throw new Error("n_compound_trials must be at least 1");
  if (params.alpha < 0 || params.alpha > 1) throw new Error("alpha must be 0-1");
  if (!params.stim_a || !params.stim_x) throw new Error("Select A and X");
  if (params.stim_a === params.stim_x) throw new Error("A and X must be different");
}

document.getElementById("back-btn").onclick = () => {
  window.location.href = "/ui/presets.html";
};

document.getElementById("n_acq").oninput = e => {
  params.n_acq = +e.target.value;
  document.getElementById("n_acq_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("n_comp").oninput = e => {
  params.n_comp = +e.target.value;
  document.getElementById("n_comp_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha").oninput = e => {
  params.alpha = +e.target.value;
  document.getElementById("a_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("salience_a").oninput = e => {
  params.salience_a = +e.target.value;
  document.getElementById("s_a_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("salience_x").oninput = e => {
  params.salience_x = +e.target.value;
  document.getElementById("s_x_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("stim_a").onchange = e => {
  params.stim_a = e.target.value;
  enforceDistinct();
  renderPayload();
};

document.getElementById("stim_x").onchange = e => {
  params.stim_x = e.target.value;
  enforceDistinct();
  renderPayload();
};

document.getElementById("representation").onchange = e => {
  params.representation = e.target.value;
  renderPayload();
};

document.getElementById("run-btn").onclick = async () => {
  const output = document.getElementById("run-output");
  output.classList.remove("error");

  let payload;
  try {
    validate();
    payload = buildPayload();
  } catch (err) {
    output.textContent = err.message;
    output.classList.add("error");
    return;
  }

  output.textContent = "Running...";

  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok && data.run_id) {
    window.location.href = `/ui/results.html?run_id=${data.run_id}`;
    return;
  }

  output.textContent = JSON.stringify(data, null, 2);
};

populateStimuli();
renderPayload();
</script>

</body>
</html>
