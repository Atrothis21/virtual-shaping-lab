<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overexpectation Preset</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    label { font-weight: 600; }
    input[type="range"], select {
      width: 100%;
      margin-top: 0.4rem;
    }

    .panel {
      border-left: 3px solid #eee;
      padding-left: 1rem;
      margin-top: 1.5rem;
    }

    button, .btn {
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }

    .error {
      background: #ffe6e6;
      color: #900;
      padding: 0.6rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>Overexpectation Preset</h1>
<p>Two-phase design: A+ and B+ intermixed, then AB+ compound.</p>

<button class="btn" id="back-btn">Back to Presets</button>

<div class="panel">
  <h3>Trials</h3>
  <label>Phase 1 Trials: <span id="n1_val">80</span></label>
  <input id="n_trials_1" type="range" min="1" max="500" value="80" />

  <label>Phase 2 Trials: <span id="n2_val">80</span></label>
  <input id="n_trials_2" type="range" min="1" max="500" value="80" />
</div>

<div class="panel">
  <h3>Learning</h3>
  <label>Alpha (Phase 1): <span id="a1_val">0.2</span></label>
  <input id="alpha_1" type="range" min="0" max="1" step="0.05" value="0.2" />

  <label>Alpha CS1 (Phase 2): <span id="a2_val">0.2</span></label>
  <input id="alpha_cs1" type="range" min="0" max="1" step="0.05" value="0.2" />

  <label>Alpha CS2 (Phase 2): <span id="a3_val">0.2</span></label>
  <input id="alpha_cs2" type="range" min="0" max="1" step="0.05" value="0.2" />

  <label>Discount (gamma): <span id="g_val">0.0</span></label>
  <input id="gamma" type="range" min="0" max="1" step="0.05" value="0.0" />
</div>

<div class="panel">
  <h3>Stimuli</h3>
  <label>CS1 (A)</label>
  <select id="stim_1"></select>

  <label>CS2 (B)</label>
  <select id="stim_2"></select>
</div>

<h2>Generated Payload</h2>
<pre id="payload-view"></pre>

<button id="run-btn">Run Experiment</button>
<pre id="run-output">Not run yet.</pre>

<script>
const STIMULI = ["tone", "noise", "light", "click"];

let params = {
  n_trials_1: 80,
  n_trials_2: 80,
  alpha_1: 0.2,
  alpha_cs1: 0.2,
  alpha_cs2: 0.2,
  gamma: 0.0,
  stim_1: "tone",
  stim_2: "noise",
  representation: "vector_elemental"
};

function populateStimuli() {
  const s1 = document.getElementById("stim_1");
  const s2 = document.getElementById("stim_2");
  s1.innerHTML = "";
  s2.innerHTML = "";

  STIMULI.forEach(s => {
    const o1 = document.createElement("option");
    o1.value = s;
    o1.textContent = s;
    if (params.stim_1 === s) o1.selected = true;
    s1.appendChild(o1);

    const o2 = document.createElement("option");
    o2.value = s;
    o2.textContent = s;
    if (params.stim_2 === s) o2.selected = true;
    s2.appendChild(o2);
  });

  disableOverlap();
}

function disableOverlap() {
  const s1 = document.getElementById("stim_1");
  const s2 = document.getElementById("stim_2");

  Array.from(s1.options).forEach(o => {
    o.disabled = (o.value === params.stim_2);
  });
  Array.from(s2.options).forEach(o => {
    o.disabled = (o.value === params.stim_1);
  });
}

function syncSelections(changed) {
  const s1 = document.getElementById("stim_1");
  const s2 = document.getElementById("stim_2");

  if (changed === "s1") {
    if (s1.value === s2.value) {
      const fallback = STIMULI.find(x => x !== s1.value);
      s2.value = fallback;
    }
  }

  if (changed === "s2") {
    if (s1.value === s2.value) {
      const fallback = STIMULI.find(x => x !== s2.value);
      s1.value = fallback;
    }
  }

  params.stim_1 = s1.value;
  params.stim_2 = s2.value;

  disableOverlap();
  renderPayload();
}

function buildPayload() {
  const compound = [params.stim_1, params.stim_2];
  const attentionMap = {
    [params.stim_1]: { attention: 1.0 },
    [params.stim_2]: { attention: 1.0 }
  };

  return {
    experiment: {
      learner: "rescorla_wagner",
      agent: "classical_agent",
      representation: {
        name: params.representation,
        params: { stimuli: STIMULI, max_compound_size: 2 }
      },
      context_inference: { enabled: false, max_contexts: 3 },
      phases: [
        {
          name: "Overexpectation: Acquisition",
          protocol: "acquisition",
          stimuli: { cs_plus: [params.stim_1, params.stim_2] },
          params: {
            n_trials: params.n_trials_1,
            alpha: params.alpha_1,
            gamma: params.gamma
          }
        },
        {
          name: "Overexpectation: Compound",
          protocol: "compound_acquisition",
          stimuli: { compound },
          params: {
            n_trials: params.n_trials_2,
            alpha_cs1: params.alpha_cs1,
            alpha_cs2: params.alpha_cs2,
            gamma: params.gamma
          }
        }
      ],
      attention: attentionMap
    },
    report: { preset: "custom_protocol" }
  };
}

function renderPayload() {
  document.getElementById("payload-view").textContent =
    JSON.stringify(buildPayload(), null, 2);
}

function validate() {
  if (params.n_trials_1 < 1) throw new Error("n_trials (phase 1) must be at least 1");
  if (params.n_trials_2 < 1) throw new Error("n_trials (phase 2) must be at least 1");
  if (params.alpha_1 < 0 || params.alpha_1 > 1) throw new Error("alpha (phase 1) must be 0-1");
  if (params.alpha_cs1 < 0 || params.alpha_cs1 > 1) throw new Error("alpha_cs1 must be 0-1");
  if (params.alpha_cs2 < 0 || params.alpha_cs2 > 1) throw new Error("alpha_cs2 must be 0-1");
  if (params.gamma < 0 || params.gamma > 1) throw new Error("gamma must be 0-1");
  if (params.stim_1 === params.stim_2) throw new Error("CS1 and CS2 must be different");
}

document.getElementById("back-btn").onclick = () => {
  window.location.href = "/ui/presets.html";
};

document.getElementById("n_trials_1").oninput = e => {
  params.n_trials_1 = +e.target.value;
  document.getElementById("n1_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("n_trials_2").oninput = e => {
  params.n_trials_2 = +e.target.value;
  document.getElementById("n2_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha_1").oninput = e => {
  params.alpha_1 = +e.target.value;
  document.getElementById("a1_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha_cs1").oninput = e => {
  params.alpha_cs1 = +e.target.value;
  document.getElementById("a2_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha_cs2").oninput = e => {
  params.alpha_cs2 = +e.target.value;
  document.getElementById("a3_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("gamma").oninput = e => {
  params.gamma = +e.target.value;
  document.getElementById("g_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("stim_1").onchange = () => {
  syncSelections("s1");
};

document.getElementById("stim_2").onchange = () => {
  syncSelections("s2");
};

document.getElementById("run-btn").onclick = async () => {
  const output = document.getElementById("run-output");
  output.classList.remove("error");

  let payload;
  try {
    validate();
    payload = buildPayload();
  } catch (err) {
    output.textContent = err.message;
    output.classList.add("error");
    return;
  }

  output.textContent = "Running...";

  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok && data.run_id) {
    window.location.href = `/ui/results.html?run_id=${data.run_id}`;
    return;
  }

  output.textContent = JSON.stringify(data, null, 2);
};

populateStimuli();
renderPayload();
</script>

</body>
</html>
