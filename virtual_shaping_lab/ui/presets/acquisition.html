<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Acquisition Preset</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    label { font-weight: 600; }
    input[type="range"], select[multiple], select {
      width: 100%;
      margin-top: 0.4rem;
    }

    select[multiple] {
      height: 6rem;
    }

    .panel {
      border-left: 3px solid #eee;
      padding-left: 1rem;
      margin-top: 1.5rem;
    }

    button, .btn {
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }

    .error {
      background: #ffe6e6;
      color: #900;
      padding: 0.6rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>Acquisition Preset</h1>
<p>Classical acquisition with a CS+ stimulus.</p>

<button class="btn" id="back-btn">Back to Presets</button>

<div class="panel">
  <h3>Trials</h3>
  <label>Number of Trials: <span id="n_val">100</span></label>
  <input id="n_trials" type="range" min="1" max="500" value="100" />
</div>

<div class="panel">
  <h3>Learning</h3>
  <label>Learning Rate (alpha): <span id="a_val">0.2</span></label>
  <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.2" />

  <label>Discount (gamma): <span id="g_val">0.0</span></label>
  <input id="gamma" type="range" min="0" max="1" step="0.05" value="0.0" />
</div>

<div class="panel">
  <h3>Stimuli</h3>
  <label>CS</label>
  <select id="cs_plus" multiple></select>

  <label>Salience (applies to selected CS): <span id="s_val">1.0</span></label>
  <input id="salience" type="range" min="0" max="1" step="0.05" value="1.0" />
</div>

<div class="panel">
  <h3>Representation</h3>
  <label>Type</label>
  <select id="representation">
    <option value="vector_elemental">vector_elemental</option>
    <option value="vector_configural">vector_configural</option>
    <option value="vector_hybrid">vector_hybrid</option>
  </select>
</div>

<h2>Generated Payload</h2>
<pre id="payload-view"></pre>

<button id="run-btn">Run Experiment</button>
<pre id="run-output">Not run yet.</pre>

<script>
const STIMULI = ["tone", "noise", "light", "click"];

let params = {
  n_trials: 100,
  alpha: 0.2,
  gamma: 0.0,
  cs_plus: ["tone"],
  salience: 1.0,
  representation: "vector_elemental"
};

function populateStimuli() {
  const select = document.getElementById("cs_plus");
  select.innerHTML = "";
  STIMULI.forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    if (params.cs_plus.includes(s)) o.selected = true;
    select.appendChild(o);
  });
}

function buildPayload() {
  const salienceMap = {};
  params.cs_plus.forEach(s => {
    salienceMap[s] = { salience: params.salience };
  });
  const attentionMap = {};
  params.cs_plus.forEach(s => {
    attentionMap[s] = { attention: 1.0 };
  });

  return {
    experiment: {
      learner: "rescorla_wagner",
      agent: "classical_agent",
      representation: {
        name: params.representation,
        params: { stimuli: STIMULI, max_compound_size: 2 }
      },
      context_inference: { enabled: false, max_contexts: 3 },
        phases: [{
          name: "Acquisition",
          protocol: "acquisition",
          stimuli: {
          cs_plus: params.cs_plus
          },
          params: {
          n_trials: params.n_trials,
          alpha: params.alpha,
          gamma: params.gamma
        }
      }],
      salience: salienceMap,
      attention: attentionMap
    },
    report: { preset: "acquisition" }
  };
}

function renderPayload() {
  document.getElementById("payload-view").textContent =
    JSON.stringify(buildPayload(), null, 2);
}

function validate() {
  if (params.n_trials < 1) throw new Error("n_trials must be at least 1");
  if (params.alpha < 0 || params.alpha > 1) throw new Error("alpha must be 0-1");
  if (params.gamma < 0 || params.gamma > 1) throw new Error("gamma must be 0-1");
  if (!params.cs_plus.length) throw new Error("Select at least one CS+ stimulus");
}

document.getElementById("back-btn").onclick = () => {
  window.location.href = "/ui/presets.html";
};

document.getElementById("n_trials").oninput = e => {
  params.n_trials = +e.target.value;
  document.getElementById("n_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("alpha").oninput = e => {
  params.alpha = +e.target.value;
  document.getElementById("a_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("gamma").oninput = e => {
  params.gamma = +e.target.value;
  document.getElementById("g_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("salience").oninput = e => {
  params.salience = +e.target.value;
  document.getElementById("s_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("cs_plus").onchange = e => {
  params.cs_plus = Array.from(e.target.selectedOptions).map(o => o.value);
  renderPayload();
};

document.getElementById("representation").onchange = e => {
  params.representation = e.target.value;
  renderPayload();
};

document.getElementById("run-btn").onclick = async () => {
  const output = document.getElementById("run-output");
  output.classList.remove("error");

  let payload;
  try {
    validate();
    payload = buildPayload();
  } catch (err) {
    output.textContent = err.message;
    output.classList.add("error");
    return;
  }

  output.textContent = "Running...";

  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok && data.run_id) {
    window.location.href = `/ui/results.html?run_id=${data.run_id}`;
    return;
  }

  output.textContent = JSON.stringify(data, null, 2);
};

populateStimuli();
renderPayload();
</script>

</body>
</html>
