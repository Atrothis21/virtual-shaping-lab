<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matching Law Preset</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    label { font-weight: 600; }
    input[type="range"], select {
      width: 100%;
      margin-top: 0.4rem;
    }

    .panel {
      border-left: 3px solid #eee;
      padding-left: 1rem;
      margin-top: 1.5rem;
    }

    button, .btn {
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    pre {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }

    .error {
      background: #ffe6e6;
      color: #900;
      padding: 0.6rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<h1>Matching Law Preset</h1>
<p>Concurrent schedules with operant choice behavior.</p>

<button class="btn" id="back-btn">Back to Presets</button>

<div class="panel">
  <h3>Trials</h3>
  <label>Number of Trials: <span id="n_val">300</span></label>
  <input id="n_trials" type="range" min="1" max="1000" value="300" />
</div>

<div class="panel">
  <h3>Left Schedule</h3>
  <label>Type</label>
  <select id="left_schedule_type">
    <option value="variable_interval">variable_interval</option>
    <option value="variable_ratio">variable_ratio</option>
    <option value="fixed_interval">fixed_interval</option>
    <option value="fixed_ratio">fixed_ratio</option>
  </select>

  <label>Value: <span id="left_schedule_val">30</span></label>
  <input id="left_schedule_value" type="range" min="1" max="100" value="30" />
</div>

<div class="panel">
  <h3>Right Schedule</h3>
  <label>Type</label>
  <select id="right_schedule_type">
    <option value="variable_interval">variable_interval</option>
    <option value="variable_ratio">variable_ratio</option>
    <option value="fixed_interval">fixed_interval</option>
    <option value="fixed_ratio">fixed_ratio</option>
  </select>

  <label>Value: <span id="right_schedule_val">60</span></label>
  <input id="right_schedule_value" type="range" min="1" max="100" value="60" />
</div>

<div class="panel">
  <h3>Policy</h3>
  <label>Policy Type</label>
  <select id="policy_type">
    <option value="epsilon_greedy">epsilon_greedy</option>
    <option value="softmax">softmax</option>
    <option value="fixed">fixed</option>
  </select>

  <div id="policy_epsilon_block">
    <label>Epsilon: <span id="eps_val">0.1</span></label>
    <input id="epsilon" type="range" min="0" max="1" step="0.05" value="0.1" />
  </div>

  <div id="policy_temp_block" style="display:none;">
    <label>Temperature: <span id="temp_val">1.0</span></label>
    <input id="temperature" type="range" min="0.1" max="5" step="0.1" value="1.0" />
  </div>

  <div id="policy_fixed_block" style="display:none;">
    <label>Fixed Action</label>
    <select id="fixed_action">
      <option value="action_0">action_0</option>
      <option value="action_1">action_1</option>
    </select>
  </div>
</div>

<div class="panel">
  <h3>Stimuli</h3>
  <label>CS+</label>
  <select id="cs_plus"></select>
</div>

<div class="panel">
  <h3>Learner / Representation</h3>
  <label>Learner</label>
  <select id="learner">
    <option value="q_learner">q_learner</option>
    <option value="td_value">td_value</option>
  </select>

  <label>Representation</label>
  <select id="representation">
    <option value="vector_elemental">vector_elemental</option>
    <option value="vector_configural">vector_configural</option>
    <option value="vector_hybrid">vector_hybrid</option>
  </select>
</div>

<h2>Generated Payload</h2>
<pre id="payload-view"></pre>

<button id="run-btn">Run Experiment</button>
<pre id="run-output">Not run yet.</pre>

<script>
const STIMULI = ["lever", "tone", "noise", "light", "click"];
const ACTIONS = ["action_0", "action_1"];

let params = {
  n_trials: 300,
  left_schedule_type: "variable_interval",
  left_schedule_value: 30,
  right_schedule_type: "variable_interval",
  right_schedule_value: 60,
  policy_type: "epsilon_greedy",
  epsilon: 0.1,
  temperature: 1.0,
  fixed_action: "action_0",
  cs_plus: "lever",
  learner: "q_learner",
  representation: "vector_elemental"
};

function buildPolicy() {
  if (params.policy_type === "epsilon_greedy") {
    return {
      name: "epsilon_greedy",
      params: { actions: ACTIONS, epsilon: params.epsilon }
    };
  }
  if (params.policy_type === "softmax") {
    return {
      name: "softmax",
      params: { actions: ACTIONS, temperature: params.temperature }
    };
  }
  return {
    name: "fixed",
    params: { action: params.fixed_action }
  };
}

function buildPayload() {
  return {
    experiment: {
      learner: params.learner,
      agent: "operant_agent",
      policy: buildPolicy(),
      representation: {
        name: params.representation,
        params: { stimuli: STIMULI, max_compound_size: 2 }
      },
      context_inference: { enabled: false, max_contexts: 3 },
      protocol: "matching_law",
      stimuli: {
        cs_plus: [params.cs_plus]
      },
      params: {
        n_trials: params.n_trials,
        schedule_left: {
          type: params.left_schedule_type,
          value: params.left_schedule_value
        },
        schedule_right: {
          type: params.right_schedule_type,
          value: params.right_schedule_value
        }
      }
    },
    report: { preset: "matching_law" }
  };
}

function renderPayload() {
  document.getElementById("payload-view").textContent =
    JSON.stringify(buildPayload(), null, 2);
}

function validate() {
  if (params.n_trials < 1) throw new Error("n_trials must be at least 1");
}

document.getElementById("back-btn").onclick = () => {
  window.location.href = "/ui/presets.html";
};

document.getElementById("n_trials").oninput = e => {
  params.n_trials = +e.target.value;
  document.getElementById("n_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("left_schedule_type").onchange = e => {
  params.left_schedule_type = e.target.value;
  renderPayload();
};

document.getElementById("left_schedule_value").oninput = e => {
  params.left_schedule_value = +e.target.value;
  document.getElementById("left_schedule_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("right_schedule_type").onchange = e => {
  params.right_schedule_type = e.target.value;
  renderPayload();
};

document.getElementById("right_schedule_value").oninput = e => {
  params.right_schedule_value = +e.target.value;
  document.getElementById("right_schedule_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("policy_type").onchange = e => {
  params.policy_type = e.target.value;

  document.getElementById("policy_epsilon_block").style.display =
    params.policy_type === "epsilon_greedy" ? "block" : "none";

  document.getElementById("policy_temp_block").style.display =
    params.policy_type === "softmax" ? "block" : "none";

  document.getElementById("policy_fixed_block").style.display =
    params.policy_type === "fixed" ? "block" : "none";

  renderPayload();
};

document.getElementById("epsilon").oninput = e => {
  params.epsilon = +e.target.value;
  document.getElementById("eps_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("temperature").oninput = e => {
  params.temperature = +e.target.value;
  document.getElementById("temp_val").textContent = e.target.value;
  renderPayload();
};

document.getElementById("fixed_action").onchange = e => {
  params.fixed_action = e.target.value;
  renderPayload();
};

document.getElementById("cs_plus").onchange = e => {
  params.cs_plus = e.target.value;
  renderPayload();
};

document.getElementById("learner").onchange = e => {
  params.learner = e.target.value;
  renderPayload();
};

document.getElementById("representation").onchange = e => {
  params.representation = e.target.value;
  renderPayload();
};

document.getElementById("run-btn").onclick = async () => {
  const output = document.getElementById("run-output");
  output.classList.remove("error");

  let payload;
  try {
    validate();
    payload = buildPayload();
  } catch (err) {
    output.textContent = err.message;
    output.classList.add("error");
    return;
  }

  output.textContent = "Running...";

  const res = await fetch("/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  if (res.ok && data.run_id) {
    window.location.href = `/ui/results.html?run_id=${data.run_id}`;
    return;
  }

  output.textContent = JSON.stringify(data, null, 2);
};

function populateStimulus() {
  const select = document.getElementById("cs_plus");
  select.innerHTML = "";
  STIMULI.forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    if (params.cs_plus === s) o.selected = true;
    select.appendChild(o);
  });
}

populateStimulus();
renderPayload();
</script>

</body>
</html>
