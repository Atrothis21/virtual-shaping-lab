<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment Presets</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    h1 { margin-bottom: 0.5rem; }
    p  { margin-top: 0; color: #555; }

    h2 {
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }

    .section-note {
      margin-top: 0;
      color: #666;
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      background: #fafafa;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.95rem;
      color: #666;
    }

    .phase-summary {
      margin-top: 0.4rem;
      margin-bottom: 0.2rem;
      color: #444;
      font-size: 0.9rem;
    }

    .teaches,
    .builder-next {
      margin-top: 0.45rem;
      margin-bottom: 0.1rem;
      color: #444;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .next-phenomenon {
      margin-top: 0.45rem;
      margin-bottom: 0.1rem;
      color: #1f2937;
      font-size: 0.86rem;
      line-height: 1.35;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }

    .badge-block {
      margin-top: 0.4rem;
    }

    .badge-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 0.25rem;
    }

    .badge-row {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: 0.55rem;
      margin-bottom: 0.2rem;
    }

    .badge {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.75rem;
      font-weight: 600;
    }

    a.button {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.5rem 1rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }

    a.button:hover {
      background: #1d4ed8;
    }

    a.button.secondary {
      background: #fff;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    a.button.secondary:hover {
      background: #f3f4f6;
    }

    .card-actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.35rem;
    }

    .btn {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #111;
      text-decoration: none;
      cursor: pointer;
    }

    .btn.secondary {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" src="/ui/js/react/preset_catalog.jsx"></script>
  <script type="text/babel" src="/ui/js/react/app.jsx"></script>
</body>
</html>
