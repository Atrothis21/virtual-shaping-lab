<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment Presets</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      max-width: 900px;
    }

    h1 { margin-bottom: 0.5rem; }
    p  { margin-top: 0; color: #555; }

    h2 {
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }

    .section-note {
      margin-top: 0;
      color: #666;
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      background: #fafafa;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.95rem;
      color: #666;
    }

    a.button {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.5rem 1rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }

    a.button:hover {
      background: #1d4ed8;
    }

    .btn {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #111;
      text-decoration: none;
      cursor: pointer;
    }

    .btn.secondary {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" src="/ui/js/react/preset_catalog.jsx"></script>
  <script type="text/babel" src="/ui/js/react/app.jsx"></script>
</body>
</html>
