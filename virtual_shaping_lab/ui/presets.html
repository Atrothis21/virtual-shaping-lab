<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment Presets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #122443;
      --panel: #1e293b;
      --panel-border: #334155;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --run: #22c55e;
      --danger: #ef4444;
      --probe: #38bdf8;
      --compound: #a78bfa;
      --learn: #f59e0b;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, #1d335d 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #10253f 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
      padding: 2rem 1.1rem 3rem;
    }

    #root {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 { margin-bottom: 0.5rem; }
    p  { margin-top: 0; color: var(--text-dim); }

    h2 {
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
      font-size: 1.12rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .section-note {
      margin-top: 0;
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .card {
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1rem;
      background: linear-gradient(180deg, #1f2f46 0%, var(--panel) 100%);
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-dim);
    }

    .phase-summary {
      margin-top: 0.4rem;
      margin-bottom: 0.2rem;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .badge-block {
      margin-top: 0.4rem;
    }

    .badge-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 0.25rem;
    }

    .badge-row {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: 0.55rem;
      margin-bottom: 0.2rem;
    }

    .badge {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      border: 1px solid #1f4a73;
      background: #0b2740;
      color: var(--probe);
      font-size: 0.75rem;
      font-weight: 600;
    }

    a.button {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(180deg, #28cc5c 0%, var(--run) 100%);
      color: #082610;
      text-decoration: none;
      border-radius: 9px;
      font-weight: 600;
      border: 1px solid #1d7a41;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    a.button:hover {
      filter: brightness(1.06);
    }

    a.button.secondary {
      background: #16243a;
      color: #dbeafe;
      border: 1px solid #2d466b;
    }

    a.button.secondary:hover {
      background: #1a2c45;
    }

    .card-actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.35rem;
    }

    .btn {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #1f4a73;
      border-radius: 8px;
      background: #0b2740;
      color: var(--probe);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn.secondary {
      background: #16243a;
      border-color: #2d466b;
      color: #dbeafe;
    }

    .btn:hover {
      filter: brightness(1.07);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" src="/ui/js/react/preset_catalog.jsx"></script>
  <script type="text/babel" src="/ui/js/react/app.jsx"></script>
</body>
</html>
