<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Shaping Lab</title>

  <style>
    :root {
      --vsl-color-bg: #0f172a;
      --vsl-color-panel: #1e293b;
      --vsl-color-panel-border: #334155;
      --vsl-color-text-primary: #e2e8f0;
      --vsl-color-text-secondary: #94a3b8;

      --vsl-color-cs-plus: #22c55e;
      --vsl-color-cs-minus: #ef4444;
      --vsl-color-probe: #38bdf8;
      --vsl-color-compound: #a78bfa;
      --vsl-color-learning: #f59e0b;

      --vsl-font-sans: "IBM Plex Sans", "Inter", "Source Sans Pro", system-ui, sans-serif;
      --vsl-font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --vsl-space-xs: 0.25rem;
      --vsl-space-sm: 0.5rem;
      --vsl-space-md: 0.75rem;
      --vsl-space-lg: 1rem;
      --vsl-space-xl: 1.5rem;

      --vsl-radius-sm: 0.375rem;
      --vsl-radius-md: 0.5rem;
      --vsl-radius-lg: 0.625rem;
      --vsl-radius-pill: 999px;

      --vsl-shadow-soft: 0 6px 20px rgba(15, 23, 42, 0.22);
    }

    body {
      font-family: var(--vsl-font-sans);
      margin: 0;
      background: var(--vsl-color-bg);
      color: var(--vsl-color-text-primary);
    }

    #root {
      min-height: 100vh;
    }

    .shell-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell-header {
      border-bottom: 1px solid var(--vsl-color-panel-border);
      background: var(--vsl-color-panel);
      padding: 1.25rem 1.5rem;
    }

    .shell-header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .shell-subtitle {
      margin: 0.35rem 0 0;
      color: var(--vsl-color-text-secondary);
    }

    .shell-body {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
    }

    .shell-nav {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 10px;
      padding: 1rem;
      background: var(--vsl-color-panel);
      height: fit-content;
      position: sticky;
      top: 1rem;
    }

    .shell-nav h3 {
      margin-top: 0;
      margin-bottom: 0.85rem;
      font-size: 1rem;
    }

    .shell-nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.45rem;
      border-radius: 8px;
      font: inherit;
      color: var(--vsl-color-text-primary);
      border: 1px solid var(--vsl-color-panel-border);
      background: #1a2537;
      cursor: pointer;
    }

    .shell-nav-item:hover {
      background: #22314a;
    }

    .shell-nav-item.active {
      background: #24344f;
      border-color: var(--vsl-color-probe);
      color: var(--vsl-color-probe);
      font-weight: 600;
    }

    .shell-main {
      display: grid;
      gap: 0.9rem;
    }

    .vsl-page-region {
      display: block;
    }

    .vsl-surface-panel {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: var(--vsl-radius-lg);
      background: var(--vsl-color-panel);
      color: var(--vsl-color-text-primary);
      box-shadow: var(--vsl-shadow-soft);
    }

    .vsl-status-badge {
      font-size: 0.75rem;
      border-radius: var(--vsl-radius-pill);
      border: 1px solid var(--vsl-color-panel-border);
      padding: 0.2rem 0.5rem;
      white-space: nowrap;
      background: #1a2537;
      color: var(--vsl-color-text-secondary);
    }

    .vsl-status-badge.success {
      border-color: var(--vsl-color-cs-plus);
      background: rgba(34, 197, 94, 0.22);
      color: #14532d;
    }

    .vsl-status-badge.warning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
    }

    .vsl-status-badge.error {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }

    .vsl-status-badge.semantic.cs-plus {
      border-color: var(--vsl-color-cs-plus);
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
    }

    .vsl-status-badge.semantic.cs-minus {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .vsl-status-badge.semantic.probe {
      border-color: var(--vsl-color-probe);
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
    }

    .vsl-status-badge.semantic.compound {
      border-color: var(--vsl-color-compound);
      background: rgba(167, 139, 250, 0.17);
      color: #c4b5fd;
    }

    .vsl-status-badge.semantic.learning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
    }

    .vsl-btn {
      border-radius: var(--vsl-radius-md);
      border: 1px solid var(--vsl-color-panel-border);
      font: inherit;
      padding: 0.42rem 0.7rem;
      cursor: pointer;
    }

    .vsl-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .vsl-btn-primary {
      border-color: var(--vsl-color-cs-plus);
      background: rgba(34, 197, 94, 0.22);
      color: var(--vsl-color-text-primary);
    }

    .vsl-btn-primary:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.3);
    }

    .vsl-btn-secondary {
      background: #1a2537;
      color: var(--vsl-color-text-primary);
    }

    .vsl-btn-secondary:hover:not(:disabled) {
      background: #22314a;
    }

    .global-banner {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 10px;
      background: var(--vsl-color-panel);
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .global-banner .banner-content {
      display: grid;
      gap: 0.2rem;
    }

    .global-banner.warning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
    }

    .global-banner.error {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }

    .banner-action {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      background: #1a2537;
      color: var(--vsl-color-text-primary);
      cursor: pointer;
      font: inherit;
    }

    .blocking-panel {
      border: 1px solid var(--vsl-color-cs-minus);
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      padding: 0.9rem;
      margin-bottom: 0.9rem;
      color: #fca5a5;
    }

    .blocking-panel h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .blocking-panel p {
      margin: 0.45rem 0 0.75rem;
    }

    .toast-stack {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      display: grid;
      gap: 0.45rem;
      z-index: 20;
      max-width: 320px;
    }

    .toast {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 8px;
      background: var(--vsl-color-panel);
      padding: 0.5rem 0.6rem;
      box-shadow: var(--vsl-shadow-soft);
      font-size: 0.86rem;
    }

    .toast.warning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.12);
    }

    .toast.error {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.14);
    }

    .route-card {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: var(--vsl-radius-lg);
      padding: 1rem 1.1rem;
      background: var(--vsl-color-panel);
      box-shadow: var(--vsl-shadow-soft);
    }

    .route-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
    }

    .route-card-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .route-status {
      display: inline-flex;
    }

    .route-card p {
      margin: 0.55rem 0 0.85rem;
      color: var(--vsl-color-text-secondary);
    }

    .route-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .preset-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.6rem;
      margin-top: 0.65rem;
    }

    .preset-controls label {
      display: grid;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--vsl-color-text-secondary);
    }

    .preset-controls input,
    .preset-controls select {
      font: inherit;
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: var(--vsl-radius-md);
      background: #1a2537;
      color: var(--vsl-color-text-primary);
      padding: 0.4rem 0.55rem;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .preset-card {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(165deg, rgba(30, 41, 59, 0.96) 0%, rgba(21, 31, 48, 0.96) 100%),
        radial-gradient(circle at 92% 8%, rgba(148, 163, 184, 0.08), transparent 42%);
    }

    .preset-card::before,
    .preset-detail::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--vsl-color-learning);
      opacity: 0.95;
    }

    .preset-card.accent-cs-plus::before,
    .preset-detail.accent-cs-plus::before {
      background: var(--vsl-color-cs-plus);
    }

    .preset-card.accent-cs-minus::before,
    .preset-detail.accent-cs-minus::before {
      background: var(--vsl-color-cs-minus);
    }

    .preset-card.accent-probe::before,
    .preset-detail.accent-probe::before {
      background: var(--vsl-color-probe);
    }

    .preset-card.accent-compound::before,
    .preset-detail.accent-compound::before {
      background: var(--vsl-color-compound);
    }

    .preset-card.accent-learning::before,
    .preset-detail.accent-learning::before {
      background: var(--vsl-color-learning);
    }

    .preset-meta-line {
      margin: 0.35rem 0 0.5rem;
      color: #9fb4cc;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .preset-meta-line code {
      font-family: var(--vsl-font-mono);
      color: #cbd5e1;
      font-size: 0.79rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .preset-card code {
      font-family: var(--vsl-font-mono);
      font-size: 0.82rem;
      color: #dbeafe;
    }

    .preset-detail {
      margin-top: 0.75rem;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(160deg, rgba(30, 41, 59, 0.98) 0%, rgba(22, 32, 49, 0.96) 100%),
        radial-gradient(circle at 90% 12%, rgba(56, 189, 248, 0.12), transparent 44%);
    }

    .preset-signal-chip-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin: 0.2rem 0 0.65rem;
    }

    .preset-signal-chip {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: var(--vsl-radius-pill);
      padding: 0.16rem 0.5rem;
      font-family: var(--vsl-font-mono);
      font-size: 0.76rem;
      letter-spacing: 0.02em;
      background: #1a2537;
      color: var(--vsl-color-text-secondary);
    }

    .preset-signal-chip.cs-plus {
      border-color: var(--vsl-color-cs-plus);
      color: #86efac;
      background: rgba(34, 197, 94, 0.14);
    }

    .preset-signal-chip.cs-minus {
      border-color: var(--vsl-color-cs-minus);
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
    }

    .preset-signal-chip.probe {
      border-color: var(--vsl-color-probe);
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.15);
    }

    .preset-signal-chip.compound {
      border-color: var(--vsl-color-compound);
      color: #c4b5fd;
      background: rgba(167, 139, 250, 0.17);
    }

    .preset-signal-chip.learning {
      border-color: var(--vsl-color-learning);
      color: #fcd34d;
      background: rgba(245, 158, 11, 0.14);
    }

    .preset-empty-cue {
      display: inline-block;
      color: var(--vsl-color-text-secondary);
      font-family: var(--vsl-font-mono);
      font-size: 0.8rem;
    }

    .preset-action-status {
      margin-top: 0.7rem;
      border-top: 1px solid var(--vsl-color-panel-border);
      padding-top: 0.65rem;
      font-size: 0.86rem;
      color: var(--vsl-color-text-secondary);
    }

    .preset-action-status code {
      font-family: var(--vsl-font-mono);
      color: #dbeafe;
      font-size: 0.82rem;
    }

    .preset-action-message {
      margin: 0.45rem 0 0;
      color: var(--vsl-color-text-secondary);
    }

    .preset-action-error {
      margin: 0.45rem 0 0;
      color: #fca5a5;
    }

    .phenomenon-support {
      margin-top: 0.75rem;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(155deg, rgba(30, 41, 59, 0.98) 0%, rgba(20, 30, 46, 0.97) 100%),
        radial-gradient(circle at 88% 14%, rgba(245, 158, 11, 0.12), transparent 40%);
    }

    .phenomenon-support::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--vsl-color-learning);
      opacity: 0.95;
    }

    .phenomenon-support.accent-cs-plus::before {
      background: var(--vsl-color-cs-plus);
    }

    .phenomenon-support.accent-cs-minus::before {
      background: var(--vsl-color-cs-minus);
    }

    .phenomenon-support.accent-probe::before {
      background: var(--vsl-color-probe);
    }

    .phenomenon-support.accent-compound::before {
      background: var(--vsl-color-compound);
    }

    .phenomenon-support.accent-learning::before {
      background: var(--vsl-color-learning);
    }

    .phenomenon-meta-line {
      margin: 0.35rem 0 0.55rem;
      color: #9fb4cc;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .phenomenon-meta-line code {
      font-family: var(--vsl-font-mono);
      color: #cbd5e1;
      font-size: 0.79rem;
      text-transform: none;
    }

    .phenomenon-signal-list {
      margin: 0.25rem 0 0.4rem 1.1rem;
      padding: 0;
      display: grid;
      gap: 0.25rem;
    }

    .phenomenon-signal-list code {
      font-family: var(--vsl-font-mono);
      color: #dbeafe;
      font-size: 0.82rem;
    }

    .preset-detail-selectors {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .preset-detail-selectors .route-action.active {
      border-color: var(--vsl-color-probe);
      color: var(--vsl-color-probe);
      font-weight: 600;
    }

    .route-action {
      text-decoration: none;
      color: var(--vsl-color-text-primary);
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 8px;
      padding: 0.42rem 0.7rem;
      background: #1a2537;
      font-size: 0.9rem;
    }

    .route-action:hover {
      background: #22314a;
    }

    @media (max-width: 900px) {
      .shell-body {
        grid-template-columns: 1fr;
      }

      .shell-nav {
        position: static;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/ui/js/react/ui_theme_tokens.js"></script>
<script src="/ui/js/react/api_client.js"></script>
<script src="/ui/js/react/state_domains.js"></script>
<script src="/ui/js/react/preset_read_models.js"></script>
<script src="/ui/js/react/preset_action_service.js"></script>
<script src="/ui/js/react/ui_architecture_contracts.js"></script>
<script type="text/babel" src="/ui/js/react/ui_foundation_primitives.jsx"></script>
<script type="text/babel" src="/ui/js/react/ui_primitives.jsx"></script>
<script type="text/babel" src="/ui/js/react/index_app.jsx"></script>
</body>
</html>
