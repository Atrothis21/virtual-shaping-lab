<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Shaping Lab</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }

    #root {
      min-height: 100vh;
    }

    .shell-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell-header {
      border-bottom: 1px solid #cbd5e1;
      background: #fff;
      padding: 1.25rem 1.5rem;
    }

    .shell-header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .shell-subtitle {
      margin: 0.35rem 0 0;
      color: #475569;
    }

    .shell-body {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
    }

    .shell-nav {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 1rem;
      background: #fff;
      height: fit-content;
      position: sticky;
      top: 1rem;
    }

    .shell-nav h3 {
      margin-top: 0;
      margin-bottom: 0.85rem;
      font-size: 1rem;
    }

    .shell-nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.45rem;
      border-radius: 8px;
      font: inherit;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
    }

    .shell-nav-item:hover {
      background: #eef2ff;
    }

    .shell-nav-item.active {
      background: #e0e7ff;
      border-color: #818cf8;
      color: #312e81;
      font-weight: 600;
    }

    .shell-main {
      display: grid;
      gap: 0.9rem;
    }

    .global-banner {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .global-banner .banner-content {
      display: grid;
      gap: 0.2rem;
    }

    .global-banner.warning {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #92400e;
    }

    .global-banner.error {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
    }

    .banner-action {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      background: #f8fafc;
      cursor: pointer;
      font: inherit;
    }

    .blocking-panel {
      border: 1px solid #ef4444;
      border-radius: 10px;
      background: #fff1f2;
      padding: 0.9rem;
      margin-bottom: 0.9rem;
      color: #881337;
    }

    .blocking-panel h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .blocking-panel p {
      margin: 0.45rem 0 0.75rem;
    }

    .toast-stack {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      display: grid;
      gap: 0.45rem;
      z-index: 20;
      max-width: 320px;
    }

    .toast {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      padding: 0.5rem 0.6rem;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12);
      font-size: 0.86rem;
    }

    .toast.warning {
      border-color: #f59e0b;
      background: #fffbeb;
    }

    .toast.error {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .route-card {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      background: #fff;
    }

    .route-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
    }

    .route-card-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .route-status {
      font-size: 0.75rem;
      color: #14532d;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 999px;
      padding: 0.2rem 0.5rem;
      white-space: nowrap;
    }

    .route-card p {
      margin: 0.55rem 0 0.85rem;
      color: #475569;
    }

    .route-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .route-action {
      text-decoration: none;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.42rem 0.7rem;
      background: #f8fafc;
      font-size: 0.9rem;
    }

    .route-action:hover {
      background: #e2e8f0;
    }

    @media (max-width: 900px) {
      .shell-body {
        grid-template-columns: 1fr;
      }

      .shell-nav {
        position: static;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/ui/js/react/api_client.js"></script>
<script src="/ui/js/react/state_domains.js"></script>
<script type="text/babel" src="/ui/js/react/ui_primitives.jsx"></script>
<script type="text/babel" src="/ui/js/react/index_app.jsx"></script>
</body>
</html>
