<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Shaping Lab</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 3rem;
      max-width: 700px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Virtual Shaping Lab</h1>
<p>How would you like to design your experiment?</p>

<div class="card">
  <h2>🧪 Predefined Experiments</h2>
  <p>
    Choose from canonical behavioral experiments
    (Pavlovian conditioning, extinction, operant schedules).
  </p>
  <button onclick="location.href='/ui/presets.html'">
    Browse Presets
  </button>
</div>

<div class="card">
  <h2>🛠 Build Your Own</h2>
  <p>
    Construct custom multi-phase experiments with full control.
  </p>
  <button onclick="location.href='/ui/builder.html'">
    Open Experiment Builder
  </button>
</div>

</body>
</html>
