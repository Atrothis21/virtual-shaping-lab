<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Shaping Lab</title>

  <style>
    :root {
      --vsl-color-bg: #0f172a;
      --vsl-color-panel: #1e293b;
      --vsl-color-panel-border: #334155;
      --vsl-color-text-primary: #e2e8f0;
      --vsl-color-text-secondary: #94a3b8;

      --vsl-color-cs-plus: #22c55e;
      --vsl-color-cs-minus: #ef4444;
      --vsl-color-probe: #38bdf8;
      --vsl-color-compound: #a78bfa;
      --vsl-color-learning: #f59e0b;

      --vsl-font-sans: "IBM Plex Sans", "Inter", "Source Sans Pro", system-ui, sans-serif;
      --vsl-font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --vsl-space-xs: 0.25rem;
      --vsl-space-sm: 0.5rem;
      --vsl-space-md: 0.75rem;
      --vsl-space-lg: 1rem;
      --vsl-space-xl: 1.5rem;

      --vsl-radius-sm: 0.375rem;
      --vsl-radius-md: 0.5rem;
      --vsl-radius-lg: 0.625rem;
      --vsl-radius-pill: 999px;

      --vsl-shadow-soft: 0 6px 20px rgba(15, 23, 42, 0.22);
    }

    body {
      font-family: var(--vsl-font-sans);
      margin: 0;
      background: var(--vsl-color-bg);
      color: var(--vsl-color-text-primary);
    }

    #root {
      min-height: 100vh;
    }

    .shell-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell-header {
      border-bottom: 1px solid var(--vsl-color-panel-border);
      background: var(--vsl-color-panel);
      padding: 1.25rem 1.5rem;
    }

    .shell-header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .shell-subtitle {
      margin: 0.35rem 0 0;
      color: var(--vsl-color-text-secondary);
    }

    .shell-body {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
    }

    .shell-nav {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 10px;
      padding: 1rem;
      background: var(--vsl-color-panel);
      height: fit-content;
      position: sticky;
      top: 1rem;
    }

    .shell-nav h3 {
      margin-top: 0;
      margin-bottom: 0.85rem;
      font-size: 1rem;
    }

    .shell-nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.45rem;
      border-radius: 8px;
      font: inherit;
      color: var(--vsl-color-text-primary);
      border: 1px solid var(--vsl-color-panel-border);
      background: #1a2537;
      cursor: pointer;
    }

    .shell-nav-item:hover {
      background: #22314a;
    }

    .shell-nav-item.active {
      background: #24344f;
      border-color: var(--vsl-color-probe);
      color: var(--vsl-color-probe);
      font-weight: 600;
    }

    .shell-main {
      display: grid;
      gap: 0.9rem;
    }

    .vsl-page-region {
      display: block;
    }

    .vsl-surface-panel {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: var(--vsl-radius-lg);
      background: var(--vsl-color-panel);
      color: var(--vsl-color-text-primary);
      box-shadow: var(--vsl-shadow-soft);
    }

    .vsl-status-badge {
      font-size: 0.75rem;
      border-radius: var(--vsl-radius-pill);
      border: 1px solid var(--vsl-color-panel-border);
      padding: 0.2rem 0.5rem;
      white-space: nowrap;
      background: #1a2537;
      color: var(--vsl-color-text-secondary);
    }

    .vsl-status-badge.success {
      border-color: var(--vsl-color-cs-plus);
      background: rgba(34, 197, 94, 0.22);
      color: #14532d;
    }

    .vsl-status-badge.warning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
    }

    .vsl-status-badge.error {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }

    .vsl-btn {
      border-radius: var(--vsl-radius-md);
      border: 1px solid var(--vsl-color-panel-border);
      font: inherit;
      padding: 0.42rem 0.7rem;
      cursor: pointer;
    }

    .vsl-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .vsl-btn-primary {
      border-color: var(--vsl-color-cs-plus);
      background: rgba(34, 197, 94, 0.22);
      color: var(--vsl-color-text-primary);
    }

    .vsl-btn-primary:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.3);
    }

    .vsl-btn-secondary {
      background: #1a2537;
      color: var(--vsl-color-text-primary);
    }

    .vsl-btn-secondary:hover:not(:disabled) {
      background: #22314a;
    }

    .global-banner {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 10px;
      background: var(--vsl-color-panel);
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .global-banner .banner-content {
      display: grid;
      gap: 0.2rem;
    }

    .global-banner.warning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
    }

    .global-banner.error {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }

    .banner-action {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      background: #1a2537;
      color: var(--vsl-color-text-primary);
      cursor: pointer;
      font: inherit;
    }

    .blocking-panel {
      border: 1px solid var(--vsl-color-cs-minus);
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      padding: 0.9rem;
      margin-bottom: 0.9rem;
      color: #fca5a5;
    }

    .blocking-panel h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .blocking-panel p {
      margin: 0.45rem 0 0.75rem;
    }

    .toast-stack {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      display: grid;
      gap: 0.45rem;
      z-index: 20;
      max-width: 320px;
    }

    .toast {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 8px;
      background: var(--vsl-color-panel);
      padding: 0.5rem 0.6rem;
      box-shadow: var(--vsl-shadow-soft);
      font-size: 0.86rem;
    }

    .toast.warning {
      border-color: var(--vsl-color-learning);
      background: rgba(245, 158, 11, 0.12);
    }

    .toast.error {
      border-color: var(--vsl-color-cs-minus);
      background: rgba(239, 68, 68, 0.14);
    }

    .route-card {
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: var(--vsl-radius-lg);
      padding: 1rem 1.1rem;
      background: var(--vsl-color-panel);
      box-shadow: var(--vsl-shadow-soft);
    }

    .route-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
    }

    .route-card-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .route-status {
      display: inline-flex;
    }

    .route-card p {
      margin: 0.55rem 0 0.85rem;
      color: var(--vsl-color-text-secondary);
    }

    .route-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .route-action {
      text-decoration: none;
      color: var(--vsl-color-text-primary);
      border: 1px solid var(--vsl-color-panel-border);
      border-radius: 8px;
      padding: 0.42rem 0.7rem;
      background: #1a2537;
      font-size: 0.9rem;
    }

    .route-action:hover {
      background: #22314a;
    }

    @media (max-width: 900px) {
      .shell-body {
        grid-template-columns: 1fr;
      }

      .shell-nav {
        position: static;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/ui/js/react/ui_theme_tokens.js"></script>
<script src="/ui/js/react/api_client.js"></script>
<script src="/ui/js/react/state_domains.js"></script>
<script type="text/babel" src="/ui/js/react/ui_foundation_primitives.jsx"></script>
<script type="text/babel" src="/ui/js/react/ui_primitives.jsx"></script>
<script type="text/babel" src="/ui/js/react/index_app.jsx"></script>
</body>
</html>
