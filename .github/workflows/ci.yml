name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

      - name: React UI smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path("virtual_shaping_lab/ui/react.html")
          assert ui.exists(), "react.html missing"
          text = ui.read_text(encoding="utf-8")
          assert "Virtual Shaping Lab" in text
          assert "Run Payload" in text
          print("React UI smoke OK")
          PY

  preset-regression:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Preset regression suite
        run: pytest tests/test_full_payloads.py
