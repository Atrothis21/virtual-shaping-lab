name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  architecture_buckets:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run guard bucket
        run: >
          pytest -q tests/v2_11_guards
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run contract bucket
        run: >
          pytest -q tests/v2_11_contract
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run behavioral bucket
        run: >
          pytest -q tests/behavioral_signatures
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run selected unit slices bucket
        run: >
          pytest -q tests/test_run_api_contract.py tests/test_api_contract_snapshots.py tests/test_visualizations.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 learner grammar bucket
        run: >
          pytest -q tests/test_v3_learner_grammar_spec.py tests/test_v3_learner_validator.py tests/test_v3_learner_registry.py tests/test_v3_learner_presets.py tests/test_v3_learner_boundary_enforcement.py tests/test_v3_learner_runtime_parity.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 rollout/records bucket
        run: >
          pytest -q tests/test_v3_rollout_record_schema.py tests/test_v3_environment_rollout_harness.py tests/test_v3_rollout_replay_harness.py tests/test_run_api_contract.py tests/test_report.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 temporal/episode bucket
        run: >
          pytest -q tests/test_v3_temporal_episode_types.py tests/test_v3_temporal_runtime_binding.py tests/test_v3_runner_environment_integration.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 phenomenon registry bucket
        run: >
          pytest -q tests/test_v3_phenomenon_registry_schema.py tests/test_v3_phenomenon_operator_constraints.py tests/test_v3_phenomenon_fixture_binding.py tests/test_v3_phenomenon_bundle_ablation.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 namespace stabilization bucket
        run: >
          pytest -q tests/test_v3_namespace_migration_map.py tests/test_v3_public_facade_stabilization.py tests/test_v3_namespace_hard_removal.py tests/test_v3_namespace_import_audit.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 UI registry contracts bucket
        run: >
          pytest -q tests/test_v3_ui_trialstate_registry.py tests/test_v3_ui_operator_registry.py tests/test_v3_ui_dependent_variable_registry.py tests/test_v3_ui_registry_integrity.py tests/test_v3_ui_preset_registry_contract.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 operator basis foundation
        run: >
          pytest -q tests/test_v3_operator_basis_schema.py tests/test_v3_operator_registry_contract.py tests/test_v3_operator_subset_contract.py tests/test_v3_operator_assembly_spec.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 acquisition preset golden path bucket
        run: >
          pytest -q tests/test_v3_ui_preset_schema_contracts.py tests/test_v3_ui_teaching_contract.py tests/test_v3_ui_payload_materialization.py tests/test_v3_ui_preset_run_flow.py tests/test_v3_ui_preset_hardening.py -k acquisition
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 UI explainability contracts
        run: >
          pytest -q tests/test_v3_ui_dependent_variable_resolver.py tests/test_v3_ui_trial_hover_explainability.py tests/test_v3_ui_operator_graph_backlinks.py tests/test_v3_ui_trialstate_inspector.py tests/test_v3_ui_report_alignment.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 operator basis compiler
        run: >
          pytest -q tests/test_v3_operator_legality_engine.py tests/test_v3_operator_selection_compiler.py tests/test_v3_operator_plan_materialization.py tests/test_v3_operator_compiler_boundaries.py tests/test_v3_operator_compiler_hardening.py tests/test_v3_operator_legality_matrix_drift.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 basis-driven assembly
        run: |
          pytest -q tests/test_v3_basis_assembly_contract.py tests/test_v3_assembly_routing_by_operator_family.py tests/test_v3_protocol_phase_boundary.py \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
          pytest -q tests/test_run_api_contract.py -k basis \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 runtime/report operator coupling
        run: |
          pytest -q tests/test_v3_operator_pipeline_types.py tests/test_v3_trial_state.py tests/test_v3_runner_environment_integration.py tests/test_v3_ui_report_alignment.py tests/test_v3_rollout_replay_harness.py \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
          pytest -q tests/test_run_api_contract.py -k "run_api_contract_fixtures or regenerates_report or operator_stage_io_provenance" \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 basis-first UI/API boundary
        run: |
          pytest -q tests/test_v3_ui_basis_authoring_contract.py tests/test_v3_ui_basis_authoring_editor_surface.py tests/test_v3_ui_preset_basis_migration.py \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
          pytest -q tests/test_ui_teaching_contract.py -k "legacy_bridge_is_disabled_for_basis_first_migrated_routes or legacy_bridge_retained_for_unmigrated_routes_via_explicit_fallback" \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
          pytest -q tests/test_run_api_contract.py -k "preset_basis_authoring_contract_endpoint_shape or basis_materialization_endpoint_emits_canonical_payload or basis_materialization_endpoint_payload_runs_for_core_presets or acquisition_basis_materialization_endpoint_payload_runs or mixed_legacy_and_canonical_payload_with_actionable_details or rejects_legacy_flat_payload_with_actionable_details or payload_mode_identity" \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"

  full_suite_compare:
    runs-on: ubuntu-latest
    needs: architecture_buckets
    continue-on-error: true
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run full suite compare (non-blocking)
        run: pytest
