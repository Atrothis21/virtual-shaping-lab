name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  architecture_buckets:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run selected unit slices bucket
        run: >
          pytest -q tests/test_api_contract_snapshots.py tests/test_visualizations.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 learner grammar bucket
        run: >
          pytest -q tests/test_v3_learner_grammar_spec.py tests/test_v3_learner_validator.py tests/test_v3_learner_registry.py tests/test_v3_learner_presets.py tests/test_v3_learner_boundary_enforcement.py tests/test_v3_learner_runtime_parity.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3.18.0 learner contract ownership
        run: >
          pytest -q tests/test_v3_learner_spec_adapters.py tests/test_v3_learner_instantiation.py tests/test_v3_learner_contract_ownership.py
          -W error
          -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3.18.5 executable learner core
        run: |
          pytest -q tests/test_v3_learner_operators_base.py tests/test_v3_learner_operators_prediction.py tests/test_v3_learner_operators_error.py tests/test_v3_learner_operators_update.py \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
          pytest -q tests/test_v3_learner_bundle_execution.py tests/test_v3_learner_numeric_golden.py tests/test_v3_learner_executable_instantiation.py \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
          pytest -q tests/test_v3_learner_presets.py tests/test_v3_learner_runtime_parity.py -k "executable or runtime_acceptance_parity_matches_registry_matrix" \
            -W error \
            -W "default:experiment.factories.phase_factory is a compatibility shim; use experiment.phases.catalog_runtime or experiment.phases.public.:DeprecationWarning"
      - name: Run V3 rollout/records bucket
        run: >
