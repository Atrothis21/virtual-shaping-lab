name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  architecture_buckets:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run guard bucket
        run: pytest -q tests/v2_11_guards
      - name: Run contract bucket
        run: pytest -q tests/v2_11_contract
      - name: Run behavioral bucket
        run: pytest -q tests/behavioral_signatures
      - name: Run selected unit slices bucket
        run: pytest -q tests/test_run_api_contract.py tests/test_api_contract_snapshots.py tests/test_visualizations.py

  full_suite_compare:
    runs-on: ubuntu-latest
    needs: architecture_buckets
    continue-on-error: true
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r virtual_shaping_lab/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run full suite compare (non-blocking)
        run: pytest
